<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MUETY | Modern Luxury E-Commerce</title>
    <meta name="description" content="MUETY - Modern, refined, and premium e-commerce shopping experience. Discover luxury collections, curated fashion, accessories, and lifestyle essentials." />
    <meta name="theme-color" content="#0f172a" />

    <link rel="icon" type="image/png" href="/muety-logo-opt.png" />
    <link rel="apple-touch-icon" href="/muety-logo-opt.png" />

    <!-- Preload Critical LCP Hero Banner (Mobile WebP & Desktop WebP) -->
    <link rel="preload" as="image" type="image/webp" media="(max-width: 640px)" href="/diwali_hero_banner_mobile.webp" fetchpriority="high" />
    <link rel="preload" as="image" type="image/webp" media="(min-width: 641px)" href="/diwali_hero_banner.webp" fetchpriority="high" />

    <!-- Google Fonts: Preconnect & Asynchronous Non-Blocking Loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Outfit:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Outfit:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Outfit:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
    </noscript>

  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
