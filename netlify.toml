[build]
  publish = "Countown"
  command = ""
  SECRETS_SCAN_ENABLED = false
  SECRETS_SCAN_OMIT_KEYS = ["ADMIN_APP_URL", "CLOUDINARY_API_KEY", "CLOUDINARY_CLOUD_NAME", "CLOUDINARY_API_SECRET", "VITE_ADMIN_APP_URL", "VITE_CLOUDINARY_API_KEY", "VITE_CLOUDINARY_CLOUD_NAME"]

[build.environment]
  NETLIFY_SKIP_NPM_INSTALL = "true"
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "ADMIN_APP_URL,CLOUDINARY_API_KEY,CLOUDINARY_CLOUD_NAME,CLOUDINARY_API_SECRET,VITE_ADMIN_APP_URL,VITE_CLOUDINARY_API_KEY,VITE_CLOUDINARY_CLOUD_NAME"
  SECRETS_SCAN_OMIT_PATHS = "scripts/*,docs/*,src/tests/*"

[[redirects]]
  from = "/terms-and-conditions"
  to = "/terms-and-conditions.html"
  status = 200

[[redirects]]
  from = "/privacy-policy"
  to = "/privacy-policy.html"
  status = 200

[[redirects]]
  from = "/api/newsletter/subscribe"
  to = "/.netlify/functions/subscribe"
  status = 200

[[redirects]]
  from = "/api/launch-status"
  to = "/.netlify/functions/launch-status"
  status = 200
