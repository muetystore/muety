[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "ADMIN_APP_URL,CLOUDINARY_API_KEY,CLOUDINARY_CLOUD_NAME,VITE_ADMIN_APP_URL,VITE_CLOUDINARY_API_KEY,VITE_CLOUDINARY_CLOUD_NAME"
  SECRETS_SCAN_OMIT_PATHS = "scripts/*,docs/*,src/tests/*"

# ------------------------------------------------------------------------------
# API Functions
# ------------------------------------------------------------------------------
[[redirects]]
  from = "/api/newsletter/subscribe"
  to = "/.netlify/functions/subscribe"
  status = 200

[[redirects]]
  from = "/api/launch-status"
  to = "/.netlify/functions/launch-status"
  status = 200

# ------------------------------------------------------------------------------
# Countdown & Legal Pages
# ------------------------------------------------------------------------------
[[redirects]]
  from = "/terms-and-conditions"
  to = "/terms-and-conditions.html"
  status = 200

[[redirects]]
  from = "/privacy-policy"
  to = "/privacy-policy.html"
  status = 200

[[redirects]]
  from = "/countdown"
  to = "/countdown.html"
  status = 200
  force = true

# ------------------------------------------------------------------------------
# Domain-Specific Hostname Routing
# ------------------------------------------------------------------------------
# Apex domain pre-launch: serves Countdown on root
[[redirects]]
  from = "https://muety.in/"
  to = "/countdown.html"
  status = 200
  force = true

[[redirects]]
  from = "https://www.muety.in/"
  to = "/countdown.html"
  status = 200
  force = true

# Admin subdomain: serves SPA Admin entry point
[[redirects]]
  from = "https://admin.muety.in/*"
  to = "/index.html"
  status = 200

# Storefront subdomain: serves SPA Storefront entry point
[[redirects]]
  from = "https://store.muety.in/*"
  to = "/index.html"
  status = 200

# ------------------------------------------------------------------------------
# Global Single Page Application (SPA) Fallback
# ------------------------------------------------------------------------------
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ------------------------------------------------------------------------------
# Security & Asset Headers
# ------------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
