[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "ADMIN_APP_URL,STORE_URL,MUETY_STORE_URL,CLOUDINARY_API_KEY,CLOUDINARY_CLOUD_NAME,VITE_ADMIN_APP_URL,VITE_CLOUDINARY_API_KEY,VITE_CLOUDINARY_CLOUD_NAME,VITE_CLOUDINARY_SIGNATURE_ENDPOINT,RESEND_FROM_EMAIL,VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID,VITE_FIREBASE_MEASUREMENT_ID,VITE_FIREBASE_DATABASE_ID,VITE_RAZORPAY_KEY_ID,FIREBASE_PROJECT_ID,LAUNCH_DATE,LAUNCH_ESTABLISHMENT,MUETY_LAUNCH_MODE"
  SECRETS_SCAN_OMIT_PATHS = "scripts/*,docs/*,src/tests/*,.env.example,countdown/.env.example,*.md,*.example,.agents/*,.agents/**,server/*"

[context.production.environment]
  SECRETS_SCAN_OMIT_KEYS = "ADMIN_APP_URL,STORE_URL,MUETY_STORE_URL,CLOUDINARY_API_KEY,CLOUDINARY_CLOUD_NAME,VITE_ADMIN_APP_URL,VITE_CLOUDINARY_API_KEY,VITE_CLOUDINARY_CLOUD_NAME,VITE_CLOUDINARY_SIGNATURE_ENDPOINT,RESEND_FROM_EMAIL,VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID,VITE_FIREBASE_MEASUREMENT_ID,VITE_FIREBASE_DATABASE_ID,VITE_RAZORPAY_KEY_ID,FIREBASE_PROJECT_ID,LAUNCH_DATE,LAUNCH_ESTABLISHMENT,MUETY_LAUNCH_MODE"
  SECRETS_SCAN_OMIT_PATHS = "scripts/*,docs/*,src/tests/*,.env.example,countdown/.env.example,*.md,*.example,.agents/*,.agents/**,server/*"

[context.deploy-preview.environment]
  SECRETS_SCAN_OMIT_KEYS = "ADMIN_APP_URL,STORE_URL,MUETY_STORE_URL,CLOUDINARY_API_KEY,CLOUDINARY_CLOUD_NAME,VITE_ADMIN_APP_URL,VITE_CLOUDINARY_API_KEY,VITE_CLOUDINARY_CLOUD_NAME,VITE_CLOUDINARY_SIGNATURE_ENDPOINT,RESEND_FROM_EMAIL,VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID,VITE_FIREBASE_MEASUREMENT_ID,VITE_FIREBASE_DATABASE_ID,VITE_RAZORPAY_KEY_ID,FIREBASE_PROJECT_ID,LAUNCH_DATE,LAUNCH_ESTABLISHMENT,MUETY_LAUNCH_MODE"
  SECRETS_SCAN_OMIT_PATHS = "scripts/*,docs/*,src/tests/*,.env.example,countdown/.env.example,*.md,*.example,.agents/*,.agents/**,server/*"

# ------------------------------------------------------------------------------
# API Functions
# ------------------------------------------------------------------------------
[[redirects]]
  from = "/api/admin/*"
  to = "/.netlify/functions/admin-api"
  status = 200

[[redirects]]
  from = "/api/media/cloudinary-signature"
  to = "/.netlify/functions/cloudinary-signature"
  status = 200

[[redirects]]
  from = "/api/cloudinary/sign"
  to = "/.netlify/functions/cloudinary-signature"
  status = 200

[[redirects]]
  from = "/api/media/cloudinary-delete"
  to = "/.netlify/functions/cloudinary-delete"
  status = 200

[[redirects]]
  from = "/api/cloudinary/delete"
  to = "/.netlify/functions/cloudinary-delete"
  status = 200

[[redirects]]
  from = "/api/newsletter/subscribe"
  to = "/.netlify/functions/subscribe"
  status = 200

[[redirects]]
  from = "/api/launch-status"
  to = "/.netlify/functions/launch-status"
  status = 200

[[redirects]]
  from = "/api/orders/*"
  to = "/.netlify/functions/orders"
  status = 200

# ------------------------------------------------------------------------------
# Countdown & Legal Pages
# ------------------------------------------------------------------------------
[[redirects]]
  from = "/terms-and-conditions"
  to = "/terms-and-conditions.html"
  status = 200

[[redirects]]
  from = "/privacy-policy"
  to = "/privacy-policy.html"
  status = 200

[[redirects]]
  from = "/countdown"
  to = "/countdown.html"
  status = 200
  force = true

# ------------------------------------------------------------------------------
# Domain-Specific Hostname Routing
# ------------------------------------------------------------------------------
[[redirects]]
  from = "https://muety.in/api/orders/*"
  to = "/.netlify/functions/orders"
  status = 200

[[redirects]]
  from = "https://www.muety.in/api/orders/*"
  to = "/.netlify/functions/orders"
  status = 200

# Apex domain pre-launch: serves Countdown on root
[[redirects]]
  from = "https://muety.in/"
  to = "/countdown.html"
  status = 200
  force = true

[[redirects]]
  from = "https://www.muety.in/"
  to = "/countdown.html"
  status = 200
  force = true

# Admin subdomain API routes (must precede wildcard)
[[redirects]]
  from = "https://admin.muety.in/api/admin/*"
  to = "/.netlify/functions/admin-api"
  status = 200

[[redirects]]
  from = "https://admin.muety.in/api/media/cloudinary-signature"
  to = "/.netlify/functions/cloudinary-signature"
  status = 200

[[redirects]]
  from = "https://admin.muety.in/api/cloudinary/sign"
  to = "/.netlify/functions/cloudinary-signature"
  status = 200

[[redirects]]
  from = "https://admin.muety.in/api/media/cloudinary-delete"
  to = "/.netlify/functions/cloudinary-delete"
  status = 200

[[redirects]]
  from = "https://admin.muety.in/api/cloudinary/delete"
  to = "/.netlify/functions/cloudinary-delete"
  status = 200

[[redirects]]
  from = "https://admin.muety.in/api/newsletter/subscribe"
  to = "/.netlify/functions/subscribe"
  status = 200

[[redirects]]
  from = "https://admin.muety.in/api/launch-status"
  to = "/.netlify/functions/launch-status"
  status = 200

[[redirects]]
  from = "https://admin.muety.in/api/orders/*"
  to = "/.netlify/functions/orders"
  status = 200

# Admin subdomain: serves SPA Admin entry point
[[redirects]]
  from = "https://admin.muety.in/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "https://admin.muety.in/*"
  to = "/index.html"
  status = 200

# Storefront subdomain API routes
[[redirects]]
  from = "https://store.muety.in/api/media/cloudinary-signature"
  to = "/.netlify/functions/cloudinary-signature"
  status = 200

[[redirects]]
  from = "https://store.muety.in/api/cloudinary/sign"
  to = "/.netlify/functions/cloudinary-signature"
  status = 200

[[redirects]]
  from = "https://store.muety.in/api/media/cloudinary-delete"
  to = "/.netlify/functions/cloudinary-delete"
  status = 200

[[redirects]]
  from = "https://store.muety.in/api/cloudinary/delete"
  to = "/.netlify/functions/cloudinary-delete"
  status = 200

[[redirects]]
  from = "https://store.muety.in/api/newsletter/subscribe"
  to = "/.netlify/functions/subscribe"
  status = 200

[[redirects]]
  from = "https://store.muety.in/api/launch-status"
  to = "/.netlify/functions/launch-status"
  status = 200

[[redirects]]
  from = "https://store.muety.in/api/orders/*"
  to = "/.netlify/functions/orders"
  status = 200

# Storefront subdomain: serves SPA Storefront entry point
[[redirects]]
  from = "https://store.muety.in/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "https://store.muety.in/*"
  to = "/index.html"
  status = 200

# ------------------------------------------------------------------------------
# Global Single Page Application (SPA) Fallback
# ------------------------------------------------------------------------------
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ------------------------------------------------------------------------------
# Security & Asset Headers
# ------------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
